
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 650px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #243b55;
            box-shadow: 0 0 6px rgba(36,59,85,0.4);
        }

        .opcoes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .opcoes label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
        }

        .opcoes input {
            width: auto;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .botao {
            width: 100%;
            padding: 14px;
            background-color: #243b55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .botao:hover {
            background-color: #141e30;
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 23px;
            }

            .opcoes {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Formulário de Cadastro</h1>
    <p class="descricao">Preencha seus dados abaixo</p>

    <form>

        <div class="campo">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>
        </div>

        <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="exemplo@email.com" required>
        </div>

        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Digite sua senha" required>
        </div>

        <div class="campo">
            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <div class="campo">
            <label for="curso">Curso:</label>
            <select id="curso" name="curso" required>
                <option value="">Selecione seu curso</option>
                <option>Engenharia de Software</option>
                <option>Ciência da Computação</option>
                <option>Sistemas de Informação</option>
                <option>Administração</option>
                <option>Direito</option>
                <option>Outro</option>
            </select>
        </div>

        <div class="campo">
            <label>Sexo:</label>
            <div class="opcoes">
                <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
                <label><input type="radio" name="sexo" value="outro"> Outro</label>
                <label><input type="radio" name="sexo" value="nao-informar"> Prefiro não informar</label>
            </div>
        </div>

        <div class="campo">
            <label>Interesses:</label>
            <div class="opcoes">
                <label><input type="checkbox" name="interesses" value="tecnologia"> Tecnologia</label>
                <label><input type="checkbox" name="interesses" value="games"> Games</label>
                <label><input type="checkbox" name="interesses" value="esportes"> Esportes</label>
                <label><input type="checkbox" name="interesses" value="musica"> Música</label>
                <label><input type="checkbox" name="interesses" value="programacao"> Programação</label>
            </div>
        </div>

        <div class="campo">
            <label for="comentarios">Comentários:</label>
            <textarea id="comentarios" name="comentarios"
                      placeholder="Escreva seus comentários..."></textarea>
        </div>

        <div class="campo">
            <label for="foto">Upload de foto:</label>
            <input type="file" id="foto" name="foto" accept="image/*">
        </div>

        <button type="submit" class="botao">Enviar cadastro</button>

    </form>
</div>

</body>
</html>
